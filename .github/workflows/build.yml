name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Enable long paths in git
        if: matrix.os == 'windows-2022'
        run: |
          git config --system core.longpaths true

      - name: Enable long paths in windows
        if: matrix.os == 'windows-2022'
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force

      - name: Checkout self
        uses: actions/checkout@v4

      - name: Checkout diesel
        uses: actions/checkout@v4
        with:
          repository: diesel-rs/diesel
          ref: refs/tags/v2.3.3
          path: diesel

      - name: Replace cargo config
        shell: pwsh
        run: |
          Move-Item -Path ".cargo/config.toml" -Destination "diesel/.cargo" -Force
          cat diesel/.cargo/config.toml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Setup MSVC
        if: matrix.os == 'windows-2022'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: 14.29
          sdk: 10.0.19041.0

      - name: Build diesel_cli
        working-directory: diesel/diesel_cli
        run: |
          cargo b -r --no-default-features --features sqlite

      - name: Archive binary
        uses: actions/upload-artifact@v4
        with:
          name: diesel_${{ matrix.os }}
          path: |
            diesel/target/release/*.so
            diesel/target/release/*.dll

            diesel/target/release/*.exe
